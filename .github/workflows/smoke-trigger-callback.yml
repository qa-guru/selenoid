# SSOT: generators/ethalon/selenoid-stack/smoke-trigger-callback.yml
# Copy to consumer: .github/workflows/smoke-trigger-callback.yml
# Sync: ./scripts/selenoid/sync-selenoid-stack-workflows.sh
#
# Prod smoke owner: qa-guru/selenoid.qa.guru (deploy.yml → this workflow, full dispatch).
# Release repos (selenoid / selenoid-ui): wait_only=true after deploy-prod-dispatch —
# pin gate only, no second deploy-smoke under prod-smoke-gate.

name: Smoke trigger with callback

on:
  workflow_call:
    inputs:
      test_tags:
        description: "Go pyramid slice (integration, api, smoke, playwright, api,smoke, cm)"
        required: true
        type: string
      source_version:
        description: "Deployed version/tag/sha"
        required: true
        type: string
      source_ref:
        description: "Git ref for selenoid-tests Go checkout"
        required: false
        type: string
        default: ""
      env_profile:
        description: "Env profile (SELENOID_TEST_ENV prefix), e.g. selenoid_qa_guru_api"
        required: false
        type: string
        default: selenoid_qa_guru_api
      source_variant:
        description: "Deploy variant (playwright, webdriver, ...)"
        required: false
        type: string
        default: ""
      source_browser:
        description: "WebDriver browser (chrome, firefox, msedge)"
        required: false
        type: string
        default: ""
      webdriver_variant:
        description: "WebDriver image variant (warm, min)"
        required: false
        type: string
        default: ""
      summary_title:
        description: "Job summary heading"
        required: false
        type: string
        default: Deploy smoke → selenoid-tests
      wait_only:
        description: "Pin wait only — no deploy-smoke dispatch/callback (release after deploy-prod-dispatch; smoke owner = selenoid.qa.guru)"
        required: false
        type: boolean
        default: false
      wait_for_prod_ui_version:
        description: "Poll prod /ui/status until .version matches source_version before dispatch (release→deploy race guard)"
        required: false
        type: boolean
        default: false
      prod_ui_status_url:
        description: "Prod UI status URL for version wait"
        required: false
        type: string
        default: https://selenoid.qa.guru/ui/status
      wait_for_prod_hub_version:
        description: "Poll prod /hub/ping until .version matches source_version before dispatch (hub release→deploy race guard)"
        required: false
        type: boolean
        default: false
      prod_hub_ping_url:
        description: "Prod hub ping URL for version wait"
        required: false
        type: string
        default: https://selenoid.qa.guru/hub/ping
      wait_timeout_minutes:
        description: "Max minutes to wait for prod pin (when wait_for_prod_*_version)"
        required: false
        type: number
        default: 10
      callback_timeout_minutes:
        # api,smoke → go-hub (api+webdriver+ui+playwright) + early callback; 8m was too tight under prod-smoke-gate.
        description: "Max minutes to wait for smoke-complete callback artifact (api,smoke envelope ~25–35m)"
        required: false
        type: number
        default: 35
    secrets:
      SELENOID_TESTS_DISPATCH_TOKEN:
        required: true

permissions:
  actions: read
  contents: read

jobs:
  trigger:
    name: Trigger selenoid-tests with callback
    runs-on: ubuntu-latest
    # wait_timeout (10) + callback_timeout (35) + dispatch/overhead.
    timeout-minutes: 50
    env:
      TESTS_REPO: qa-guru/selenoid-tests
      TEST_TAGS: ${{ inputs.test_tags }}
      ENV_PROFILE: ${{ inputs.env_profile }}
      SUMMARY_TITLE: ${{ inputs.summary_title }}
      WAIT_ONLY: ${{ inputs.wait_only }}

    steps:
      - name: Validate configuration
        run: |
          if [[ "${WAIT_ONLY}" != "true" && -z "${{ secrets.SELENOID_TESTS_DISPATCH_TOKEN }}" ]]; then
            echo "::error::Secret SELENOID_TESTS_DISPATCH_TOKEN is not set (PAT with repo scope on ${TESTS_REPO})."
            exit 1
          fi
          if [[ "${WAIT_ONLY}" == "true" && "${{ inputs.wait_for_prod_ui_version }}" != "true" && "${{ inputs.wait_for_prod_hub_version }}" != "true" ]]; then
            echo "::error::wait_only requires wait_for_prod_ui_version and/or wait_for_prod_hub_version."
            exit 1
          fi

      - name: Resolve source ref
        id: meta
        run: |
          ref="${{ inputs.source_ref }}"
          if [[ -z "${ref}" ]]; then
            ref="${{ github.ref_name }}"
          fi
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "version=${{ inputs.source_version }}" >> "$GITHUB_OUTPUT"

      - name: Wait for prod UI pin
        if: inputs.wait_for_prod_ui_version
        env:
          PROD_VERSION_URL: ${{ inputs.prod_ui_status_url }}
          EXPECTED_VERSION: ${{ inputs.source_version }}
          WAIT_TIMEOUT_MINUTES: ${{ inputs.wait_timeout_minutes }}
          PROD_LABEL: UI
          DEPLOY_HINT: "ui_version"
        run: |
          set -euo pipefail
          expected="${EXPECTED_VERSION#v}"
          expected="${expected%%[*}"
          deadline=$(($(date +%s) + WAIT_TIMEOUT_MINUTES * 60))
          echo "Waiting until ${PROD_VERSION_URL} reports ${PROD_LABEL} version matching '${EXPECTED_VERSION}' (timeout ${WAIT_TIMEOUT_MINUTES}m)..."
          echo "Release image publish ≠ prod pin — smoke must wait for selenoid.qa.guru deploy."
          while [[ "$(date +%s)" -lt "${deadline}" ]]; do
            body="$(curl -fsSL "${PROD_VERSION_URL}" || true)"
            version="$(printf '%s' "${body}" | jq -r '.version // empty' 2>/dev/null || true)"
            if [[ -n "${version}" ]]; then
              # Prod stamps look like v3.0.11[2026-07-27_02:23:20PM]
              if [[ "${version}" == "${EXPECTED_VERSION}"* ]] || [[ "${version}" == "v${expected}"* ]] || [[ "${version}" == "${expected}"* ]]; then
                echo "Prod ${PROD_LABEL} version ready: ${version}"
                # Settle: hub/nginx must accept /status after pin flip (avoid 502 race).
                if curl -fsSL --max-time 5 https://selenoid.qa.guru/status >/dev/null 2>&1; then
                  sleep 15
                  exit 0
                fi
                echo "Version matched but /status not healthy yet — keep waiting"
              else
                echo "Prod still on: ${version} (want ${EXPECTED_VERSION})"
              fi
            else
              echo "Prod ${PROD_VERSION_URL} not ready yet"
            fi
            sleep 20
          done
          echo "::error::Timed out waiting for prod ${PROD_LABEL} pin ${EXPECTED_VERSION} at ${PROD_VERSION_URL}."
          echo "::error::Deploy via qa-guru/selenoid.qa.guru (${DEPLOY_HINT}=${EXPECTED_VERSION}), then re-run or rely on post-deploy smoke."
          exit 1

      - name: Wait for prod hub pin
        if: inputs.wait_for_prod_hub_version
        env:
          PROD_VERSION_URL: ${{ inputs.prod_hub_ping_url }}
          EXPECTED_VERSION: ${{ inputs.source_version }}
          WAIT_TIMEOUT_MINUTES: ${{ inputs.wait_timeout_minutes }}
          PROD_LABEL: hub
          DEPLOY_HINT: "version"
        run: |
          set -euo pipefail
          expected="${EXPECTED_VERSION#v}"
          expected="${expected%%[*}"
          deadline=$(($(date +%s) + WAIT_TIMEOUT_MINUTES * 60))
          echo "Waiting until ${PROD_VERSION_URL} reports ${PROD_LABEL} version matching '${EXPECTED_VERSION}' (timeout ${WAIT_TIMEOUT_MINUTES}m)..."
          echo "Release image publish ≠ prod pin — smoke must wait for selenoid.qa.guru deploy."
          while [[ "$(date +%s)" -lt "${deadline}" ]]; do
            body="$(curl -fsSL "${PROD_VERSION_URL}" || true)"
            version="$(printf '%s' "${body}" | jq -r '.version // empty' 2>/dev/null || true)"
            if [[ -n "${version}" ]]; then
              if [[ "${version}" == "${EXPECTED_VERSION}"* ]] || [[ "${version}" == "v${expected}"* ]] || [[ "${version}" == "${expected}"* ]]; then
                echo "Prod ${PROD_LABEL} version ready: ${version}"
                if curl -fsSL --max-time 5 https://selenoid.qa.guru/status >/dev/null 2>&1; then
                  sleep 15
                  exit 0
                fi
                echo "Version matched but /status not healthy yet — keep waiting"
              else
                echo "Prod still on: ${version} (want ${EXPECTED_VERSION})"
              fi
            else
              echo "Prod ${PROD_VERSION_URL} not ready yet"
            fi
            sleep 20
          done
          echo "::error::Timed out waiting for prod ${PROD_LABEL} pin ${EXPECTED_VERSION} at ${PROD_VERSION_URL}."
          echo "::error::Deploy via qa-guru/selenoid.qa.guru (${DEPLOY_HINT}=${EXPECTED_VERSION}), then re-run or rely on post-deploy smoke."
          exit 1

      - name: Job summary (wait_only — pin gate)
        if: inputs.wait_only
        run: |
          {
            echo "## ${SUMMARY_TITLE}"
            echo ""
            echo "- Mode: \`wait_only\` (prod pin gate — **no** second \`deploy-smoke\`)"
            echo "- Deploy version: \`${{ steps.meta.outputs.version }}\`"
            echo "- Prod smoke owner: [\`qa-guru/selenoid.qa.guru\`](https://github.com/qa-guru/selenoid.qa.guru) \`deploy.yml\` → tags \`${{ env.TEST_TAGS }}\`"
            echo "- Concurrency: \`prod-smoke-gate\` (single owner avoids duplicate queue)"
            echo "- [This run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch deploy-smoke to selenoid-tests
        if: ${{ !inputs.wait_only }}
        env:
          SOURCE_VARIANT: ${{ inputs.source_variant }}
          SOURCE_BROWSER: ${{ inputs.source_browser }}
          WEBDRIVER_VARIANT: ${{ inputs.webdriver_variant }}
        run: |
          set -euo pipefail
          payload="$(jq -n \
            --arg source_repo "${{ github.repository }}" \
            --arg source_version "${{ steps.meta.outputs.version }}" \
            --arg source_ref "${{ steps.meta.outputs.ref }}" \
            --arg env_profile "${{ env.ENV_PROFILE }}" \
            --arg test_tags "${{ env.TEST_TAGS }}" \
            --arg trigger_run_id "${{ github.run_id }}-${{ github.run_attempt }}" \
            --arg source_variant "${SOURCE_VARIANT}" \
            --arg source_browser "${SOURCE_BROWSER}" \
            --arg webdriver_variant "${WEBDRIVER_VARIANT}" \
            '{
              source_repo: $source_repo,
              source_version: $source_version,
              source_ref: $source_ref,
              env_profile: $env_profile,
              test_tags: $test_tags,
              skip_go_unit: true,
              trigger_run_id: $trigger_run_id
            }
            + (if $source_variant != "" then {source_variant: $source_variant} else {} end)
            + (if $source_browser != "" then {source_browser: $source_browser} else {} end)
            + (if $webdriver_variant != "" then {webdriver_variant: $webdriver_variant} else {} end)')"
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.SELENOID_TESTS_DISPATCH_TOKEN }}" \
            "https://api.github.com/repos/${{ env.TESTS_REPO }}/dispatches" \
            -d "$(jq -n --argjson client_payload "${payload}" '{event_type: "deploy-smoke", client_payload: $client_payload}')"

      - name: Wait for smoke-complete callback
        id: wait
        if: ${{ !inputs.wait_only }}
        env:
          GH_TOKEN: ${{ github.token }}
          CALLBACK_TIMEOUT_MINUTES: ${{ inputs.callback_timeout_minutes }}
          # Include run_attempt so gh run rerun --failed does not pick a stale callback artifact.
          ARTIFACT_NAME: smoke-result-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          DEADLINE=$(($(date +%s) + CALLBACK_TIMEOUT_MINUTES * 60))
          ARTIFACT_ID=""
          echo "Waiting for artifact ${ARTIFACT_NAME} (smoke-complete callback, timeout ${CALLBACK_TIMEOUT_MINUTES}m)..."
          while [[ "$(date +%s)" -lt "${DEADLINE}" ]]; do
            ARTIFACT_ID="$(gh api \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${ARTIFACT_NAME}&per_page=1" \
              --jq '.artifacts[0].id // empty')"
            if [[ -n "${ARTIFACT_ID}" ]]; then
              break
            fi
            sleep 15
          done
          if [[ -z "${ARTIFACT_ID}" ]]; then
            echo "::error::Timed out waiting for smoke-complete callback (artifact ${ARTIFACT_NAME}, ${CALLBACK_TIMEOUT_MINUTES}m)."
            exit 1
          fi
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/smoke-result.zip
          unzip -p /tmp/smoke-result.zip smoke-result.json > /tmp/smoke-result.json
          jq -e . /tmp/smoke-result.json >/dev/null

      - name: Load smoke result
        id: smoke
        if: ${{ !inputs.wait_only && steps.wait.outcome == 'success' }}
        run: |
          set -euo pipefail
          while IFS='=' read -r key value; do
            case "${key}" in
              conclusion|report_url|testops_url|run_url|quality_gate|tests_run_id|stats)
                echo "${key}=${value}" >> "$GITHUB_OUTPUT"
                ;;
            esac
          done < <(jq -r '
            to_entries[]
            | select(.key as $k | ["conclusion","report_url","testops_url","run_url","quality_gate","tests_run_id","stats"] | index($k))
            | "\(.key)=\(.value)"
          ' /tmp/smoke-result.json)
          report_built="$(jq -r '.report_built // "false"' /tmp/smoke-result.json)"
          echo "report_built=${report_built}" >> "$GITHUB_OUTPUT"

      - name: Job summary
        if: ${{ !inputs.wait_only && always() && steps.wait.outcome == 'success' }}
        env:
          STATS_JSON: ${{ steps.smoke.outputs.stats }}
        run: |
          {
            echo "## ${SUMMARY_TITLE}"
            echo ""
            echo "- Prod smoke owner: this workflow (caller repo) → [\`${{ env.TESTS_REPO }}\`](https://github.com/${{ env.TESTS_REPO }}) \`deploy-smoke\`"
            echo "- Env profile: \`${{ env.ENV_PROFILE }}\`"
            echo "- Tags slice: \`${{ env.TEST_TAGS }}\`"
            echo "- Callback timeout: \`${{ inputs.callback_timeout_minutes }}m\` (api,smoke envelope)"
            echo "- Go unit: skipped (\`skip_go_unit\`)"
            echo "- Deploy version: \`${{ steps.meta.outputs.version }}\`"
            echo "- [Trigger run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            if [[ -n "${{ steps.smoke.outputs.run_url }}" ]]; then
              echo "- [selenoid-tests run](${{ steps.smoke.outputs.run_url }})"
            fi
            if [[ -n "${STATS_JSON}" ]]; then
              passed="$(echo "${STATS_JSON}" | jq -r '.passed // 0')"
              failed="$(echo "${STATS_JSON}" | jq -r '.failed // 0')"
              broken="$(echo "${STATS_JSON}" | jq -r '.broken // 0')"
              skipped="$(echo "${STATS_JSON}" | jq -r '.skipped // 0')"
              echo "- Tests: **passed** ${passed}, **failed** ${failed}, **broken** ${broken}, **skipped** ${skipped}"
            fi
            if [[ "${{ steps.smoke.outputs.report_built }}" == "true" && -n "${{ steps.smoke.outputs.report_url }}" ]]; then
              echo "- [Allure 3 report](${{ steps.smoke.outputs.report_url }})"
              dashboard_url="${{ steps.smoke.outputs.report_url }}"
              dashboard_url="${dashboard_url/\/awesome\//\/dashboard\/}"
              echo "- [Allure 3 dashboard](${dashboard_url})"
            else
              echo "- Allure 3 report: _не собран (нет результатов или ошибка генерации)_"
            fi
            if [[ -n "${{ steps.smoke.outputs.testops_url }}" ]]; then
              echo "- [Allure TestOps launch](${{ steps.smoke.outputs.testops_url }})"
            else
              echo "- Allure TestOps launch: _не загружен (см. selenoid-tests run)_"
            fi
            if [[ "${{ steps.smoke.outputs.quality_gate }}" == "passed" ]]; then
              echo "- Allure 3 quality gate: passed"
            elif [[ "${{ steps.smoke.outputs.quality_gate }}" == "failed" ]]; then
              echo "- Allure 3 quality gate: **failed**"
            fi
            if [[ "${{ steps.smoke.outputs.conclusion }}" == "success" ]]; then
              echo "- Smoke: **passed**"
            else
              echo "- Smoke: **failed**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Job summary (callback timeout)
        if: ${{ !inputs.wait_only && always() && steps.wait.outcome != 'success' }}
        run: |
          {
            echo "## ${{ inputs.summary_title }}"
            echo ""
            echo "- Target: [\`${{ env.TESTS_REPO }}\`](https://github.com/${{ env.TESTS_REPO }})"
            echo "- Deploy version: \`${{ steps.meta.outputs.version }}\`"
            echo "- Callback timeout: \`${{ inputs.callback_timeout_minutes }}m\`"
            echo "- smoke-complete callback: _не получен (timeout или нет callback token в selenoid-tests)_"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if prod smoke failed
        if: ${{ !inputs.wait_only && always() && steps.smoke.outputs.conclusion != '' && steps.smoke.outputs.conclusion != 'success' }}
        run: |
          echo "::error::selenoid-tests deploy-smoke concluded with: ${{ steps.smoke.outputs.conclusion }}"
          exit 1
